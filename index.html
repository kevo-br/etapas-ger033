<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etapas do GER033</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D7552'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1D7552">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita; resumo no topo, abas Frentes/Cronograma, filtros por fase e situação, e a árvore expansível abaixo. */
:root {
  --bg: #F3F6F4;
  --surface: #FFFFFF;
  --ink: #15201C;
  --muted: #5A6963;
  --line: #D9E1DD;
  --accent: #1D7552;
  --accent-soft: #E0F0E8;
  --warn: #9A6400;
  --warn-soft: #FAEFD6;
  --idle: #66707A;
  --idle-soft: #ECEFF1;
  --bad: #B3261E;
  --bad-soft: #FBE3E1;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1412; --surface: #151D1A; --ink: #E4ECE8; --muted: #95A49E; --line: #27322E;
    --accent: #4DC28E; --accent-soft: #163227; --warn: #E2A83C; --warn-soft: #33270E;
    --idle: #9AA4AE; --idle-soft: #212926; --bad: #F2847C; --bad-soft: #3A1A18;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px;
}
.topo { display: grid; gap: 8px; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 40px); line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }

.resumo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; }
.placar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.num { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.num .de { color: var(--muted); font-weight: 600; font-size: 22px; }
.rot { color: var(--muted); }
.barra { height: 8px; border-radius: 99px; background: var(--idle-soft); overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--idle-soft); color: var(--idle); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.and { background: var(--warn-soft); color: var(--warn); }
.chip.erro { background: var(--bad-soft); color: var(--bad); }

.controles { display: grid; gap: 14px; }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.abas button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--muted); padding: 8px 14px; font-size: 14.5px; font-weight: 600; }
.abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.abas button:hover:not([aria-selected="true"]) { color: var(--ink); }
.fases { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fases .rotulo { font-size: 12px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.fases button { border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); padding: 4px 12px; font-size: 13px; }
.fases button:hover:not([aria-pressed="true"]) { color: var(--ink); background: var(--idle-soft); }
.fases button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.ferr { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
.filtros { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.filtros button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); }
.filtros button:last-child { border-right: 0; }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.acoes { display: inline-flex; gap: 6px; }
button { font: inherit; font-size: 13.5px; font-weight: 500; padding: 6px 12px; cursor: pointer; }
.acoes button { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.acoes button:hover, .filtros button:hover:not([aria-pressed="true"]) { color: var(--ink); background: var(--idle-soft); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#lista { display: grid; gap: 20px; }
.bloco { display: grid; gap: 8px; }
.secao { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.secao .periodo { text-transform: none; letter-spacing: 0; }
.arvore { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.grupo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.linha { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 8px; flex-wrap: wrap; }
.caret { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; padding: 0; border-radius: 6px; display: grid; place-items: center; flex: none; }
.caret:hover { background: var(--idle-soft); color: var(--ink); }
.caret svg { transition: transform .15s ease; }
.caret[aria-expanded="true"] svg { transform: rotate(90deg); }
input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.titulo { font-weight: 600; flex: 1 1 200px; min-width: 0; cursor: pointer; }
.periodo { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.conta { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill, .atrasada { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.and { background: var(--warn-soft); color: var(--warn); }
.pill.pend { background: var(--idle-soft); color: var(--idle); }
.atrasada { background: var(--bad-soft); color: var(--bad); }

.corpo { padding: 0 16px 14px 47px; display: grid; gap: 8px; }
.desc, .nota { margin: 0; font-size: 14px; color: var(--muted); max-width: 64ch; }
.nota { padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); }
.nota strong { color: var(--warn); font-weight: 600; }
.itens { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--line); display: grid; gap: 2px; }
.itens li { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; }
.itens li input { margin-top: 2px; }
.itens label { cursor: pointer; min-width: 0; }
.itens li.feito label { color: var(--muted); }
.itens li.pai { display: block; }
.pai > .lin { display: flex; align-items: flex-start; gap: 10px; }
.pai > .lin input { margin-top: 2px; }
.pai > .lin label { font-weight: 600; }
.pai > .itens { margin: 6px 0 4px 8px; }
.tarefa { display: grid; gap: 1px; }
.tmeta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12.5px; color: var(--muted); }
.tmeta .tatraso { color: var(--bad); font-weight: 600; }
.vazio { margin: 0; padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.aviso { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--bad-soft); color: var(--ink); }
.aviso strong { color: var(--bad); }
.aviso code { font-family: var(--mono); font-size: 13px; }
.travado input { cursor: not-allowed; }
.itens li > label { flex: 1 1 auto; }
.andam { flex: none; align-self: flex-start; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 10px; }
.andam:hover:not([aria-pressed="true"]) { color: var(--ink); background: var(--idle-soft); }
.andam[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tmeta .taguarda { color: var(--warn); font-weight: 600; }
.tmeta .tandam { color: var(--accent); font-weight: 600; }
.peso { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.valefase { margin: 0; font-size: 13.5px; color: var(--muted); }
.valefase strong { color: var(--ink); font-weight: 600; }
.recorte { margin: 0; font-size: 13px; color: var(--muted); }
.painel-filtros { display: grid; gap: 12px; }
.toggle-filtros { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 8px 12px; }
.toggle-filtros:hover { background: var(--idle-soft); }
.tf-nome { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tf-resumo { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.tf-resumo.ativo { color: var(--accent); font-weight: 600; }
.toggle-filtros svg { flex: none; color: var(--muted); transition: transform .15s ease; }
.toggle-filtros[aria-expanded="true"] svg { transform: rotate(90deg); }
.filtros-corpo { display: grid; gap: 10px; padding: 0 2px; }
.rodape { margin: 0; font-size: 12.5px; color: var(--muted); }

@media (max-width: 480px) {
  .corpo { padding-left: 16px; }
  .ferr { flex-direction: column; }
  .filtros { width: 100%; }
  .filtros button { flex: 1; }
  .abas button { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .barra span, .caret svg { transition: none; }
}
</style>
</head>
<body>
<main id="root" class="wrap">
  <header class="topo">
    <h1>Etapas do projeto</h1>
    <p class="lead">Carregando etapas…</p>
  </header>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // ===== CONFIGURAÇÃO (único trecho que muda de um projeto para outro) =====
  // url:   painel do Supabase > Project Settings > Data API (só o endereço, sem /rest/v1).
  // chave: Project Settings > API Keys > chave "publishable" (em projetos antigos, a "anon public").
  //        A chave pública pode ficar aqui: quem protege os dados são as regras do schema.sql.
  // projeto: textos do topo da página e o nome da aba do navegador.
  window.ETAPAS_CONFIG = {
    url: "https://yidbazcnjsbwwgddbzoh.supabase.co",
    chave: "sb_publishable_nqX9eiXFnimoAzclEzjhYg_Wm_HSkO7",
    projeto: {
      aba: "Etapas do GER033",
      rotulo: "GER033 · Analista Virtual do Mapa Diário",
      titulo: "Etapas do projeto",
      descricao: "O projeto nasceu como um agente de IA para conferir o Mapa Diário. Essa conferência já foi feita internamente e está em produção, e o projeto foi atualizado para que o agente de IA atue nas explicações e nos laudos sobre os dados do mapa."
    }
  };
</script>
<script>
(function () {
  var NOMES_FILTRO = { todos: 'Todos', pendentes: 'Pendentes', feitos: 'Concluídos' };
  var TIPOS = { analise: 'Análise', desenvolvimento: 'Desenvolvimento', validacao: 'Validação' };
  var CHEVRON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var root = document.getElementById('root');
  var cfg = window.ETAPAS_CONFIG || {};
  var PROJ = cfg.projeto || {};
  if (PROJ.aba) document.title = PROJ.aba;
  // as preferências de tela (aba, filtros, o que está aberto) ficam no navegador, separadas por projeto:
  // todos os sites do mesmo usuário no GitHub Pages dividem o mesmo localStorage
  var CHAVE_UI = 'etapas-ui:' + (cfg.url || location.pathname);

  // Modelo:
  //  grupos   = frentes de trabalho
  //  fases    = fases do cronograma, cada uma com suas tarefas
  //  itens    = itens das frentes; cada um pendurado numa tarefa (tarefa_id)
  //  tarefas  = tarefas do cronograma; cada uma numa frente (grupo_id)
  //  folhas   = o que se marca: todos os itens + as tarefas sem itens.
  //             Todas as folhas valem o mesmo no total do projeto.
  //  _k       = 'item' ou 'tarefa' (o tipo da linha; "tipo" é análise/desenvolvimento/validação)
  var grupos = [], fases = [], itens = [], tarefas = [], folhas = [];
  var temCronograma = false, unificado = false, temTipos = false, temAndamento = false;
  var assinaturaCasca = '';
  var carga = 'carregando'; // carregando | pronto | config | erro
  var erroCarga = '';
  var chip = ['neutro', 'Conectando…'];
  var salvando = 0;
  var ui = carregarUi();

  var configurado = cfg.url && cfg.chave && cfg.url.indexOf('SEU-PROJETO') < 0 && cfg.chave.indexOf('COLE-AQUI') < 0;
  var sb = null;
  if (!configurado) {
    carga = 'config';
  } else if (!window.supabase || !window.supabase.createClient) {
    carga = 'erro';
    erroCarga = 'A biblioteca do Supabase não carregou. Confira a conexão com a internet e recarregue a página.';
  } else {
    sb = window.supabase.createClient(cfg.url, cfg.chave);
  }

  // ---------- utilidades ----------
  function carregarUi() {
    var padrao = { abertos: {}, filtro: 'todos', aba: 'frentes', fase: 'todas', tipo: 'todos' };
    try {
      var s = localStorage.getItem(CHAVE_UI);
      if (s) {
        var o = JSON.parse(s);
        return { abertos: o.abertos || {}, filtro: o.filtro || 'todos', aba: o.aba || 'frentes', fase: o.fase || 'todas', tipo: o.tipo || 'todos', filtrosAbertos: !!o.filtrosAbertos };
      }
    } catch (e) {}
    return padrao;
  }
  function salvarUi() {
    try { localStorage.setItem(CHAVE_UI, JSON.stringify(ui)); } catch (e) {}
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function fmt(iso) {
    try { return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return ''; }
  }
  function hoje() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
  function periodo(a, b) {
    if (!a && !b) return '';
    if (!b || a === b) return dm(a || b);
    return dm(a) + ' – ' + dm(b);
  }
  // percentual do projeto inteiro (todas as folhas valem o mesmo)
  function pctTotal(n) {
    var t = folhas.length;
    return t ? (n * 100 / t).toFixed(1).replace('.', ',') + '%' : '0%';
  }
  function situacao(lista) {
    var n = lista.length, f = lista.filter(function (i) { return i.feito; }).length;
    var andando = lista.some(function (i) { return !i.feito && i.em_andamento; });
    if (n > 0 && f === n) return { n: n, f: f, cls: 'ok', txt: 'Concluído' };
    if (f === 0 && !andando) return { n: n, f: f, cls: 'pend', txt: 'Pendente' };
    return { n: n, f: f, cls: 'and', txt: 'Em andamento' };
  }
  function passaFiltro(x) {
    if (ui.filtro === 'pendentes') return !x.feito;
    if (ui.filtro === 'feitos') return x.feito;
    return true;
  }
  function grupoPassa(s) {
    if (ui.filtro === 'pendentes') return s.f < s.n;
    if (ui.filtro === 'feitos') return s.f > 0;
    return true;
  }
  function aberto(chave, lista) {
    if (Object.prototype.hasOwnProperty.call(ui.abertos, chave)) return ui.abertos[chave];
    var s = situacao(lista);
    return s.f < s.n;
  }
  function porId(lista, id) { return lista.filter(function (x) { return x.id === id; })[0]; }
  function acharGrupo(id) { return porId(grupos, id); }
  function acharFase(id) { return porId(fases, id); }
  function acharItem(id) { return porId(itens, id); }
  function acharTarefa(id) { return porId(tarefas, id); }
  function tituloCurto(f) { return f ? (f.titulo_curto || f.titulo) : ''; }

  function faseDe(x) { return x._k === 'tarefa' ? x.fase_id : (x.tarefa ? x.tarefa.fase_id : null); }
  function inicioDe(x) { return x._k === 'tarefa' ? x.inicio : (x.tarefa ? x.tarefa.inicio : null); }
  function fimDe(x) { return x._k === 'tarefa' ? x.fim : (x.tarefa ? x.tarefa.fim : null); }
  function passaTipo(x) { return ui.tipo === 'todos' || x.tipo === ui.tipo; }
  function noEscopo(x) { return (ui.fase === 'todas' || faseDe(x) === ui.fase) && passaTipo(x); }
  function folhasDaTarefa(t) { return t.filhos.length ? t.filhos : [t]; }
  function concluida(t) { return t.filhos.length ? t.filhos.every(function (k) { return k.feito; }) : !!t.feito; }

  // Situação de uma folha ainda não concluída:
  //  aguardando = predecessoras ainda não concluídas (nesse caso não conta como atraso)
  //  atrasada   = prazo passou e nada mais segura a tarefa
  function estadoDe(x, dia) {
    if (x.feito) return { feito: true, aguardando: [], atrasada: false, andamento: false };
    var t = x._k === 'tarefa' ? x : x.tarefa;
    var deps = (t && t.depende_de) || [];
    var pend = deps.map(acharTarefa).filter(function (d) { return d && !concluida(d); });
    var fim = fimDe(x);
    return { feito: false, aguardando: pend, atrasada: !pend.length && !!fim && fim < dia, andamento: !!x.em_andamento };
  }
  function contarAtrasadas(lista, dia) {
    return lista.filter(function (x) { return estadoDe(x, dia).atrasada; }).length;
  }
  function tagsEstado(x, dia) {
    var e = estadoDe(x, dia), out = [];
    if (e.feito) return out;
    if (e.aguardando.length) {
      out.push('<span class="taguarda">Aguardando: ' + esc(e.aguardando[0].texto) + (e.aguardando.length > 1 ? ' e mais ' + (e.aguardando.length - 1) : '') + '</span>');
    } else if (e.atrasada) {
      out.push('<span class="tatraso">Atrasada</span>');
    }
    return out;
  }
  function definirChip(cls, txt) {
    chip = [cls, txt];
    var el = document.getElementById('chip');
    if (el) { el.className = 'chip ' + cls; el.textContent = txt; }
  }

  // ---------- montagem dos dados ----------
  function montar(rg, ri, rf, rt) {
    grupos = rg; itens = ri; fases = rf; tarefas = rt;
    var mg = {}, mf = {}, mt = {};
    grupos.forEach(function (g) { mg[g.id] = g; g.folhas = []; });
    fases.forEach(function (f) { mf[f.id] = f; f.tarefas = []; });
    tarefas.forEach(function (t) { t._k = 'tarefa'; t.filhos = []; mt[t.id] = t; if (mf[t.fase_id]) mf[t.fase_id].tarefas.push(t); });
    itens.forEach(function (i) {
      i._k = 'item';
      i.tarefa = (unificado && i.tarefa_id && mt[i.tarefa_id]) || null;
      if (i.tarefa) i.tarefa.filhos.push(i);
    });
    function ordemGrupo(x) { var g = mg[x.grupo_id]; return g ? g.ordem : 999; }
    tarefas.forEach(function (t) {
      t.filhos.sort(function (a, b) { return (ordemGrupo(a) - ordemGrupo(b)) || (a.ordem - b.ordem); });
    });

    folhas = itens.slice();
    if (unificado) tarefas.forEach(function (t) { if (!t.filhos.length) folhas.push(t); });

    function ordemFase(x) { var f = mf[faseDe(x)]; return f ? f.ordem : 999; }
    folhas.forEach(function (x) { if (mg[x.grupo_id]) mg[x.grupo_id].folhas.push(x); });
    // o que não tem frente (ou aponta para uma frente que não existe) vai para um grupo à parte
    var semFrente = folhas.filter(function (x) { return !mg[x.grupo_id]; });
    if (semFrente.length) {
      var sem = { id: '_sem', ordem: 99999, titulo: 'Sem frente definida', descricao: null, nota: null, folhas: semFrente };
      grupos.push(sem);
      mg[sem.id] = sem;
    }
    grupos.forEach(function (g) {
      g.folhas.sort(function (a, b) {
        var da = inicioDe(a) || '9999', db = inicioDe(b) || '9999';
        if (da !== db) return da < db ? -1 : 1;
        return (ordemFase(a) - ordemFase(b)) || ((a.tarefa ? a.tarefa.ordem : a.ordem) - (b.tarefa ? b.tarefa.ordem : b.ordem)) || (a.ordem - b.ordem);
      });
    });
    temTipos = folhas.some(function (x) { return !!x.tipo; });
    var amostra = itens[0] || tarefas[0];
    temAndamento = !!amostra && Object.prototype.hasOwnProperty.call(amostra, 'em_andamento');
  }

  // ---------- desenho ----------
  function topo() {
    return '<header class="topo">' +
      (PROJ.rotulo ? '<p class="eyebrow">' + esc(PROJ.rotulo) + '</p>' : '') +
      '<h1>' + esc(PROJ.titulo || 'Etapas do projeto') + '</h1>' +
      (PROJ.descricao ? '<p class="lead">' + esc(PROJ.descricao) + '</p>' : '') +
      '</header>';
  }

  // A casca (título, resumo, abas, filtros) é montada uma vez só; depois só o
  // resumo e a lista são redesenhados. Assim um clique num filtro nunca se
  // perde por causa de uma atualização que chegou do banco no meio dele.
  function montarCasca() {
    var controles = '';
    if (temCronograma) {
      controles +=
        '<div class="abas" role="tablist" aria-label="Visão">' +
        '<button type="button" role="tab" data-aba="frentes" data-foco="t-frentes">Frentes de trabalho</button>' +
        '<button type="button" role="tab" data-aba="cronograma" data-foco="t-cronograma">Cronograma</button>' +
        (temTipos ? '<button type="button" role="tab" data-aba="tipos" data-foco="t-tipos">Por tipo</button>' : '') +
        '</div>';
    }
    // Fase e Tipo ficam num painel recolhível; fechado, mostra só o resumo do que está filtrado
    var linhasFiltro = '';
    if (temCronograma) {
      linhasFiltro +=
        '<div class="fases" role="group" aria-label="Fase do cronograma"><span class="rotulo">Fase</span>' +
        '<button type="button" data-fase="todas" data-foco="p-todas">Todas</button>' +
        fases.map(function (f) {
          return '<button type="button" data-fase="' + esc(f.id) + '" data-foco="p-' + esc(f.id) + '">' + esc(tituloCurto(f)) + '</button>';
        }).join('') +
        '</div>';
    }
    if (temTipos) {
      linhasFiltro +=
        '<div class="fases" role="group" aria-label="Tipo"><span class="rotulo">Tipo</span>' +
        '<button type="button" data-tipo="todos" data-foco="y-todos">Todos</button>' +
        Object.keys(TIPOS).map(function (k) {
          return '<button type="button" data-tipo="' + k + '" data-foco="y-' + k + '">' + TIPOS[k] + '</button>';
        }).join('') +
        '</div>';
    }
    if (linhasFiltro) {
      controles +=
        '<div class="painel-filtros">' +
        '<button type="button" class="toggle-filtros" data-filtros="1" data-foco="filtros" aria-controls="filtros-corpo">' +
        '<span class="tf-nome">Filtros</span><span class="tf-resumo" id="filtros-resumo"></span>' + CHEVRON + '</button>' +
        '<div class="filtros-corpo" id="filtros-corpo">' + linhasFiltro + '</div>' +
        '</div>';
    }
    controles +=
      '<div class="ferr">' +
      '<div class="filtros" role="group" aria-label="Mostrar">' +
      ['todos', 'pendentes', 'feitos'].map(function (f) {
        return '<button type="button" data-filtro="' + f + '" data-foco="f-' + f + '">' + NOMES_FILTRO[f] + '</button>';
      }).join('') + '</div>' +
      '<div class="acoes"><button type="button" data-acao="abrir" data-foco="a-abrir">Expandir tudo</button><button type="button" data-acao="fechar" data-foco="a-fechar">Recolher tudo</button></div>' +
      '</div>';

    root.innerHTML = topo() +
      '<section class="resumo" id="resumo" aria-label="Progresso"></section>' +
      '<div class="controles">' + controles + '</div>' +
      '<div id="lista"></div>' +
      '<p class="rodape">Todos os itens valem o mesmo no total do projeto. Uma tarefa só conta como atrasada se o prazo passou e tudo de que ela depende já foi concluído; senão aparece como "Aguardando". As marcações ficam salvas para todos e aparecem sozinhas para quem estiver com a página aberta.</p>';
  }

  function metaHtml(partes) {
    partes = partes.filter(Boolean);
    return partes.length ? '<span class="tmeta">' + partes.map(function (p) { return '<span>' + p + '</span>'; }).join('') + '</span>' : '';
  }

  // uma folha (item ou tarefa sem itens): checkbox, texto, detalhes e botão "Em andamento"
  function folhaHtml(x, meta, travar) {
    var k = x._k;
    var pref = k === 'tarefa' ? 't-' : 'i-';
    var mh = metaHtml(meta || []);
    var botao = (temAndamento && !x.feito)
      ? '<button type="button" class="andam" data-andamento="' + k + ':' + esc(x.id) + '" data-foco="an-' + pref + esc(x.id) + '" aria-pressed="' + !!x.em_andamento + '"' + (travar ? ' disabled' : '') + '>Em andamento</button>'
      : '';
    return '<li' + (x.feito ? ' class="feito"' : '') + '>' +
      '<input type="checkbox" id="' + pref + esc(x.id) + '" data-' + k + '="' + esc(x.id) + '" data-foco="' + pref + esc(x.id) + '"' + (x.feito ? ' checked' : '') + (travar ? ' disabled' : '') + '>' +
      '<label for="' + pref + esc(x.id) + '"' + (mh ? ' class="tarefa"' : '') + '><span>' + esc(x.texto) + '</span>' + mh + '</label>' + botao + '</li>';
  }

  function cabecalhoStatus(s, nAtrasadas) {
    return nAtrasadas ? '<span class="atrasada">' + nAtrasadas + (nAtrasadas > 1 ? ' atrasadas' : ' atrasada') + '</span>' : '<span class="pill ' + s.cls + '">' + s.txt + '</span>';
  }

  // ---- aba Frentes ----
  function cartaoFrente(g, travar, dia) {
    var lista = g.folhas.filter(noEscopo);
    if (!lista.length) return '';
    var s = situacao(lista);
    if (!grupoPassa(s)) return '';
    var chave = 'g:' + g.id;
    var ab = aberto(chave, lista);
    var visiveis = lista.filter(passaFiltro);
    return '<li class="grupo ' + s.cls + (travar ? ' travado' : '') + '">' +
      '<div class="linha">' +
      '<button type="button" class="caret" data-abrir="' + esc(chave) + '" data-foco="c-' + esc(chave) + '" aria-expanded="' + ab + '" aria-controls="corpo-' + esc(chave) + '" aria-label="' + (ab ? 'Recolher ' : 'Expandir ') + esc(g.titulo) + '">' + CHEVRON + '</button>' +
      '<input type="checkbox" id="g-' + esc(g.id) + '" data-grupo="' + esc(g.id) + '" data-foco="g-' + esc(g.id) + '"' + (s.f === s.n ? ' checked' : '') + (s.f > 0 && s.f < s.n ? ' data-meio="1"' : '') + (travar ? ' disabled' : '') + '>' +
      '<label for="g-' + esc(g.id) + '" class="titulo">' + esc(g.titulo) + '</label>' +
      '<span class="peso" title="Quanto esta frente vale no projeto">' + pctTotal(lista.length) + '</span>' +
      '<span class="conta">' + s.f + '/' + s.n + '</span>' +
      cabecalhoStatus(s, contarAtrasadas(lista, dia)) +
      '</div>' +
      '<div class="corpo" id="corpo-' + esc(chave) + '"' + (ab ? '' : ' hidden') + '>' +
      '<p class="valefase">Vale <strong>' + pctTotal(lista.length) + '</strong> do projeto · <strong>' + pctTotal(s.f) + '</strong> já concluído.</p>' +
      (g.descricao ? '<p class="desc">' + esc(g.descricao) + '</p>' : '') +
      (g.nota && s.f < s.n ? '<p class="nota"><strong>Por que falta:</strong> ' + esc(g.nota) + '</p>' : '') +
      '<ul class="itens">' + visiveis.map(function (x) {
        var meta = [];
        if (unificado) {
          meta.push(esc(tituloCurto(acharFase(faseDe(x)))));
          meta.push(esc(periodo(inicioDe(x), fimDe(x))));
          if (x._k === 'tarefa') meta.push(esc(x.responsavel || ''));
          else if (x.tarefa) meta.push('em: ' + esc(x.tarefa.texto));
        }
        if (x.tipo) meta.push(esc(TIPOS[x.tipo] || ''));
        meta = meta.concat(tagsEstado(x, dia));
        return folhaHtml(x, meta, travar);
      }).join('') + '</ul>' +
      '</div></li>';
  }

  // ---- aba Por tipo ----
  var DESC_TIPOS = {
    analise: 'Levantamentos de requisitos, definições, regras e critérios.',
    desenvolvimento: 'Construção: tabelas, rotinas, e-mail, telas, alertas e o agente da Paipe.',
    validacao: 'Testes internos, validação com usuários e documentação de cada fase.'
  };
  function folhasDoTipo(k) {
    return folhas.filter(function (x) { return x.tipo === k && (ui.fase === 'todas' || faseDe(x) === ui.fase); });
  }
  function cartaoTipo(k, travar, dia) {
    var lista = folhasDoTipo(k);
    if (!lista.length) return '';
    var s = situacao(lista);
    if (!grupoPassa(s)) return '';
    var chave = 't:' + k;
    var ab = aberto(chave, lista);
    var frentesPorId = {};
    grupos.forEach(function (g) { frentesPorId[g.id] = g.titulo; });
    var visiveis = lista.filter(passaFiltro).sort(function (a, b) {
      var da = inicioDe(a) || '9999', db = inicioDe(b) || '9999';
      return da < db ? -1 : da > db ? 1 : 0;
    });
    return '<li class="grupo ' + s.cls + (travar ? ' travado' : '') + '">' +
      '<div class="linha">' +
      '<button type="button" class="caret" data-abrir="' + chave + '" data-foco="c-' + chave + '" aria-expanded="' + ab + '" aria-controls="corpo-' + chave + '" aria-label="' + (ab ? 'Recolher ' : 'Expandir ') + TIPOS[k] + '">' + CHEVRON + '</button>' +
      '<input type="checkbox" id="tb-' + k + '" data-tipobox="' + k + '" data-foco="tb-' + k + '"' + (s.f === s.n ? ' checked' : '') + (s.f > 0 && s.f < s.n ? ' data-meio="1"' : '') + (travar ? ' disabled' : '') + '>' +
      '<label for="tb-' + k + '" class="titulo">' + TIPOS[k] + '</label>' +
      '<span class="peso" title="Quanto este tipo vale no projeto">' + pctTotal(lista.length) + '</span>' +
      '<span class="conta">' + s.f + '/' + s.n + '</span>' +
      cabecalhoStatus(s, contarAtrasadas(lista, dia)) +
      '</div>' +
      '<div class="corpo" id="corpo-' + chave + '"' + (ab ? '' : ' hidden') + '>' +
      '<p class="valefase">Vale <strong>' + pctTotal(lista.length) + '</strong> do projeto · <strong>' + pctTotal(s.f) + '</strong> já concluído.</p>' +
      '<p class="desc">' + esc(DESC_TIPOS[k]) + '</p>' +
      '<ul class="itens">' + visiveis.map(function (x) {
        var meta = [
          esc(tituloCurto(acharFase(faseDe(x)))),
          esc(periodo(inicioDe(x), fimDe(x))),
          esc(frentesPorId[x.grupo_id] || ''),
          x._k === 'tarefa' ? esc(x.responsavel || '') : (x.tarefa ? 'em: ' + esc(x.tarefa.texto) : '')
        ].concat(tagsEstado(x, dia));
        return folhaHtml(x, meta, travar);
      }).join('') + '</ul>' +
      '</div></li>';
  }

  // ---- aba Cronograma ----
  function tarefaHtml(t, travar, dia) {
    var metaT = [esc(periodo(t.inicio, t.fim)), esc(t.duracao || ''), esc(t.responsavel || ''), esc(TIPOS[t.tipo] || '')];
    if (!t.filhos.length) {
      if (!passaFiltro(t) || !passaTipo(t)) return '';
      metaT.push(pctTotal(1) + ' do total');
      return folhaHtml(t, metaT.concat(tagsEstado(t, dia)), travar);
    }
    var doTipo = t.filhos.filter(passaTipo);
    var kids = doTipo.filter(passaFiltro);
    if (!kids.length) return '';
    var s = situacao(doTipo);
    metaT.push(s.f + '/' + s.n);
    metaT.push(pctTotal(doTipo.length) + ' do total');
    var e = estadoDe(t.filhos.filter(function (k) { return !k.feito; })[0] || t, dia);
    if (s.f < s.n) {
      if (e.aguardando.length) metaT.push('<span class="taguarda">Aguardando: ' + esc(e.aguardando[0].texto) + (e.aguardando.length > 1 ? ' e mais ' + (e.aguardando.length - 1) : '') + '</span>');
      else if (t.fim && t.fim < dia) metaT.push('<span class="tatraso">Atrasada</span>');
      if (s.cls === 'and') metaT.push('<span class="tandam">Em andamento</span>');
    }
    var frentesPorId = {};
    grupos.forEach(function (g) { frentesPorId[g.id] = g.titulo; });
    return '<li class="pai' + (s.f === s.n ? ' feito' : '') + '"><div class="lin">' +
      '<input type="checkbox" id="tp-' + esc(t.id) + '" data-tarefapai="' + esc(t.id) + '" data-foco="tp-' + esc(t.id) + '"' + (s.f === s.n ? ' checked' : '') + (s.f > 0 && s.f < s.n ? ' data-meio="1"' : '') + (travar ? ' disabled' : '') + '>' +
      '<label for="tp-' + esc(t.id) + '" class="tarefa"><span>' + esc(t.texto) + '</span>' + metaHtml(metaT) + '</label></div>' +
      '<ul class="itens">' + kids.map(function (i) {
        return folhaHtml(i, [esc(frentesPorId[i.grupo_id] || ''), esc(TIPOS[i.tipo] || '')], travar);
      }).join('') + '</ul></li>';
  }

  function cartaoFase(f, travar, dia) {
    var lista = [];
    f.tarefas.forEach(function (t) { lista = lista.concat(folhasDaTarefa(t)); });
    lista = lista.filter(passaTipo);
    if (!lista.length) return '';
    var s = situacao(lista);
    if (!grupoPassa(s)) return '';
    var chave = 'f:' + f.id;
    var ab = aberto(chave, lista);
    return '<li class="grupo ' + s.cls + (travar ? ' travado' : '') + '">' +
      '<div class="linha">' +
      '<button type="button" class="caret" data-abrir="' + esc(chave) + '" data-foco="c-' + esc(chave) + '" aria-expanded="' + ab + '" aria-controls="corpo-' + esc(chave) + '" aria-label="' + (ab ? 'Recolher ' : 'Expandir ') + esc(f.titulo) + '">' + CHEVRON + '</button>' +
      '<input type="checkbox" id="fx-' + esc(f.id) + '" data-fasebox="' + esc(f.id) + '" data-foco="fx-' + esc(f.id) + '"' + (s.f === s.n ? ' checked' : '') + (s.f > 0 && s.f < s.n ? ' data-meio="1"' : '') + (travar ? ' disabled' : '') + '>' +
      '<label for="fx-' + esc(f.id) + '" class="titulo">' + esc(f.titulo) + '</label>' +
      '<span class="periodo">' + esc(periodo(f.inicio, f.fim)) + '</span>' +
      '<span class="peso" title="Quanto esta fase vale no projeto">' + pctTotal(lista.length) + '</span>' +
      '<span class="conta">' + s.f + '/' + s.n + '</span>' +
      cabecalhoStatus(s, contarAtrasadas(lista, dia)) +
      '</div>' +
      '<div class="corpo" id="corpo-' + esc(chave) + '"' + (ab ? '' : ' hidden') + '>' +
      '<p class="valefase">' + (ui.tipo !== 'todos' ? esc(TIPOS[ui.tipo]) + ' nesta fase vale ' : 'Esta fase vale ') + '<strong>' + pctTotal(lista.length) + '</strong> do projeto · <strong>' + pctTotal(s.f) + '</strong> já concluído.</p>' +
      '<ul class="itens">' + f.tarefas.map(function (t) { return tarefaHtml(t, travar, dia); }).join('') + '</ul>' +
      '</div></li>';
  }

  function render() {
    if (carga === 'config') {
      root.innerHTML = topo() + '<p class="aviso"><strong>Falta configurar o Supabase.</strong> Preencha a URL do projeto e a chave pública no bloco <code>ETAPAS_CONFIG</code> do <code>index.html</code> e recarregue a página.</p>';
      return;
    }
    if (carga === 'erro') {
      root.innerHTML = topo() + '<p class="aviso"><strong>Não foi possível carregar as etapas.</strong> ' + esc(erroCarga) + '</p>';
      return;
    }
    if (carga === 'carregando') {
      root.innerHTML = topo() + '<p class="vazio">Carregando etapas…</p>';
      return;
    }

    if (!temCronograma) { ui.aba = 'frentes'; ui.fase = 'todas'; }
    if (ui.fase !== 'todas' && !acharFase(ui.fase)) ui.fase = 'todas';
    if (!temTipos || (ui.tipo !== 'todos' && !TIPOS[ui.tipo])) ui.tipo = 'todos';
    if (ui.aba === 'tipos' && !temTipos) ui.aba = 'frentes';

    var ativo = document.activeElement;
    var foco = ativo && ativo.getAttribute ? ativo.getAttribute('data-foco') : null;
    var travar = salvando > 0;
    var dia = hoje();
    if (!document.getElementById('lista')) montarCasca();

    // resumo: o recorte escolhido (fase + tipo) dentro do projeto inteiro
    var escopo = folhas.filter(noEscopo);
    var total = escopo.length;
    var feitos = escopo.filter(function (x) { return x.feito; }).length;
    var pct = total ? Math.round(feitos * 100 / total) : 0;
    var feitosProjeto = folhas.filter(function (x) { return x.feito; }).length;
    var ultima = null;
    itens.concat(tarefas).forEach(function (x) { if (x.atualizado_em && (!ultima || x.atualizado_em > ultima)) ultima = x.atualizado_em; });
    var faseAtual = ui.fase !== 'todas' ? acharFase(ui.fase) : null;
    var partes = [];
    if (ui.tipo !== 'todos') partes.push(TIPOS[ui.tipo]);
    if (faseAtual) partes.push(tituloCurto(faseAtual));
    var recortado = partes.length > 0;
    var rotulo = 'itens concluídos' + (recortado ? ' em ' + partes.join(' · ') : '') + ' · ' + pct + '%';
    var atrasadas = contarAtrasadas(escopo, dia);
    var andamento = escopo.filter(function (x) { return !x.feito && x.em_andamento; }).length;

    document.getElementById('resumo').innerHTML =
      '<div class="placar"><span class="num">' + feitos + '<span class="de">/' + total + '</span></span><span class="rot">' + esc(rotulo) + '</span></div>' +
      '<div class="barra" role="progressbar" aria-label="' + esc(rotulo) + '" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + feitos + '"><span style="width:' + pct + '%"></span></div>' +
      '<p class="recorte">' +
      (recortado
        ? 'Este recorte vale <strong>' + pctTotal(total) + '</strong> do projeto e já entrega <strong>' + pctTotal(feitos) + '</strong>. Projeto inteiro: ' + pctTotal(feitosProjeto) + ' concluído.'
        : 'Projeto inteiro: <strong>' + pctTotal(feitosProjeto) + '</strong> concluído.') +
      (andamento ? ' ' + andamento + ' em andamento.' : '') +
      (atrasadas ? ' ' + atrasadas + (atrasadas > 1 ? ' atrasados.' : ' atrasado.') : '') +
      '</p>' +
      '<div class="meta"><span id="chip" class="chip ' + chip[0] + '" role="status">' + esc(chip[1]) + '</span>' +
      (ultima ? '<span>Última alteração: ' + esc(fmt(ultima)) + '</span>' : '') + '</div>';

    [['data-filtro', ui.filtro], ['data-fase', ui.fase], ['data-tipo', ui.tipo]].forEach(function (p) {
      Array.prototype.forEach.call(root.querySelectorAll('[' + p[0] + ']'), function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute(p[0]) === p[1]));
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-aba]'), function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-aba') === ui.aba));
    });
    var tgl = root.querySelector('[data-filtros]');
    if (tgl) {
      tgl.setAttribute('aria-expanded', String(!!ui.filtrosAbertos));
      document.getElementById('filtros-corpo').hidden = !ui.filtrosAbertos;
      var rf = document.getElementById('filtros-resumo');
      rf.textContent = 'Fase: ' + (faseAtual ? tituloCurto(faseAtual) : 'Todas') + (temTipos ? ' · Tipo: ' + (ui.tipo !== 'todos' ? TIPOS[ui.tipo] : 'Todos') : '');
      rf.className = 'tf-resumo' + (recortado ? ' ativo' : '');
    }

    var h;
    if (ui.aba === 'cronograma') {
      var visiveis = ui.fase === 'todas' ? fases : fases.filter(function (f) { return f.id === ui.fase; });
      var cardsF = visiveis.map(function (f) { return cartaoFase(f, travar, dia); }).join('');
      h = cardsF ? '<ul class="arvore">' + cardsF + '</ul>' : '<p class="vazio">Nenhum item com esse filtro.</p>';
    } else if (ui.aba === 'tipos') {
      var cardsT = Object.keys(TIPOS).filter(function (k) { return ui.tipo === 'todos' || k === ui.tipo; })
        .map(function (k) { return cartaoTipo(k, travar, dia); }).join('');
      h = cardsT ? '<ul class="arvore">' + cardsT + '</ul>' : '<p class="vazio">Nenhum item com esse filtro.</p>';
    } else {
      var cardsG = grupos.map(function (g) { return cartaoFrente(g, travar, dia); }).join('');
      h = cardsG ? '<ul class="arvore">' + cardsG + '</ul>' : '<p class="vazio">Nenhum item com esse filtro.</p>';
    }

    var lista = document.getElementById('lista');
    lista.innerHTML = h;
    Array.prototype.forEach.call(lista.querySelectorAll('input[data-meio]'), function (i) { i.indeterminate = true; });
    if (foco && !root.querySelector('[data-foco="' + foco + '"]:focus')) {
      var alvo = root.querySelector('[data-foco="' + foco + '"]');
      if (alvo && !alvo.disabled) alvo.focus();
    }
  }

  // Atualizações que chegam do banco esperam o dedo/mouse soltar,
  // para não trocar a lista embaixo de um clique em andamento.
  var ponteiroAbaixo = false, renderPendente = false;
  function pedirRender() {
    if (ponteiroAbaixo) { renderPendente = true; return; }
    render();
  }
  document.addEventListener('pointerdown', function () { ponteiroAbaixo = true; }, true);
  function soltou() {
    setTimeout(function () {
      ponteiroAbaixo = false;
      if (renderPendente) { renderPendente = false; render(); }
    }, 0);
  }
  document.addEventListener('pointerup', soltou, true);
  document.addEventListener('pointercancel', soltou, true);

  // ---------- dados ----------
  function carregar() {
    return Promise.all([
      sb.from('etapas_grupos').select('*').order('ordem'),
      sb.from('etapas_itens').select('*').order('ordem'),
      sb.from('etapas_fases').select('*').order('ordem'),
      sb.from('cronograma_tarefas').select('*').order('ordem')
    ]).then(function (r) {
      if (r[0].error || r[1].error) throw (r[0].error || r[1].error);
      var semCrono = r[2].error || r[3].error;
      var rf = semCrono ? [] : r[2].data;
      var rt = semCrono ? [] : r[3].data;
      unificado = rt.length > 0 && Object.prototype.hasOwnProperty.call(rt[0], 'grupo_id');
      montar(r[0].data, r[1].data, rf, rt);
      temCronograma = fases.length > 0;

      var assinatura = fases.map(function (f) { return f.id + '=' + tituloCurto(f); }).join('|') + '#' + temTipos;
      if (assinatura !== assinaturaCasca) {
        assinaturaCasca = assinatura;
        if (document.getElementById('lista')) root.innerHTML = '';   // filtros mudaram: remonta a casca
      }

      carga = 'pronto';
      if (chip[1] === 'Conectando…') definirChip('ok', 'Tudo salvo');
      pedirRender();
    }).catch(function (e) {
      if (carga === 'pronto') {
        definirChip('erro', 'Sem conexão com o banco. As marcações podem estar desatualizadas.');
        return;
      }
      carga = 'erro';
      erroCarga = (e && e.message ? e.message + '. ' : '') + 'Confira a URL e a chave no ETAPAS_CONFIG do index.html e se o supabase.sql foi executado.';
      render();
    });
  }

  // grava a mesma alteração em várias folhas (itens e/ou tarefas sem itens)
  function gravar(alvos, mudanca, aplicar) {
    var antes = alvos.map(function (x) { return [x, x.feito, x.em_andamento]; });
    alvos.forEach(aplicar);
    var idsItens = alvos.filter(function (x) { return x._k === 'item'; }).map(function (x) { return x.id; });
    var idsTarefas = alvos.filter(function (x) { return x._k === 'tarefa'; }).map(function (x) { return x.id; });
    salvando++;
    definirChip('and', 'Salvando…');
    render();

    function uma(tabela, ids) {
      if (!ids.length) return Promise.resolve({ ok: true, data: [] });
      return sb.from(tabela).update(mudanca).in('id', ids).select('id, atualizado_em').then(function (r) {
        return { ok: !r.error && r.data && r.data.length === ids.length, erro: r.error, data: r.data || [], tabela: tabela };
      });
    }
    Promise.all([uma('etapas_itens', idsItens), uma('cronograma_tarefas', idsTarefas)]).then(function (res) {
      salvando--;
      var falha = res.filter(function (x) { return !x.ok; })[0];
      if (falha) {
        antes.forEach(function (p) {
          var gravado = res.some(function (x) { return x.ok && x.data.some(function (d) { return d.id === p[0].id; }); });
          if (!gravado) { p[0].feito = p[1]; p[0].em_andamento = p[2]; }
        });
        definirChip('erro', falha.erro ? 'Não foi possível salvar: ' + falha.erro.message : 'Não foi possível salvar: o banco recusou a alteração.');
      } else {
        res.forEach(function (x) {
          x.data.forEach(function (d) {
            var alvo = x.tabela === 'etapas_itens' ? acharItem(d.id) : acharTarefa(d.id);
            if (alvo) alvo.atualizado_em = d.atualizado_em;
          });
        });
        definirChip('ok', 'Tudo salvo');
      }
      render();
    }, function () {
      salvando--;
      antes.forEach(function (p) { p[0].feito = p[1]; p[0].em_andamento = p[2]; });
      definirChip('erro', 'Sem conexão. A alteração não foi salva; tente de novo.');
      render();
    });
  }

  function marcar(alvos, valor) {
    alvos = alvos.filter(function (x) { return !!x.feito !== valor; });
    if (!alvos.length) { render(); return; }
    var mudanca = (valor && temAndamento) ? { feito: true, em_andamento: false } : { feito: valor };
    gravar(alvos, mudanca, function (x) { x.feito = valor; if (valor) x.em_andamento = false; });
  }

  function marcarAndamento(x, valor) {
    gravar([x], { em_andamento: valor }, function (y) { y.em_andamento = valor; });
  }

  function aoAtualizar(achar) {
    return function (p) {
      if (salvando > 0) return;   // é o eco da própria alteração em andamento
      var x = p.new && achar(p.new.id);
      var mesmoLugar = x && (x.tarefa_id || null) === (p.new.tarefa_id || null) &&
        (x.grupo_id || null) === (p.new.grupo_id || null) && x.texto === p.new.texto &&
        (x.tipo || null) === (p.new.tipo || null) &&
        JSON.stringify(x.depende_de || null) === JSON.stringify(p.new.depende_de || null);
      if (mesmoLugar) {
        x.feito = p.new.feito;
        x.em_andamento = p.new.em_andamento;
        x.atualizado_em = p.new.atualizado_em;
        pedirRender();
      } else {
        carregar();   // mudou texto, tipo, frente, tarefa ou dependência: recarrega tudo
      }
    };
  }

  function ouvirMudancas() {
    sb.channel('etapas-ger033')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'etapas_itens' }, aoAtualizar(acharItem))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'cronograma_tarefas' }, aoAtualizar(acharTarefa))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'etapas_itens' }, function () { carregar(); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'etapas_itens' }, function () { carregar(); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cronograma_tarefas' }, function () { carregar(); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'cronograma_tarefas' }, function () { carregar(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'etapas_grupos' }, function () { carregar(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'etapas_fases' }, function () { carregar(); })
      .subscribe();
  }

  // ---------- interação ----------
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (carga !== 'pronto' || salvando > 0) return;
    var v = t.checked;
    if (t.hasAttribute('data-item')) {
      var i = acharItem(t.getAttribute('data-item'));
      if (i) marcar([i], v);
    } else if (t.hasAttribute('data-tarefa')) {
      var tf = acharTarefa(t.getAttribute('data-tarefa'));
      if (tf) marcar([tf], v);
    } else if (t.hasAttribute('data-tarefapai')) {
      var tp = acharTarefa(t.getAttribute('data-tarefapai'));
      if (tp) marcar(tp.filhos.filter(passaTipo), v);
    } else if (t.hasAttribute('data-grupo')) {
      var g = acharGrupo(t.getAttribute('data-grupo'));
      if (g) marcar(g.folhas.filter(noEscopo), v);
    } else if (t.hasAttribute('data-fasebox')) {
      var f = acharFase(t.getAttribute('data-fasebox'));
      if (f) {
        var l = [];
        f.tarefas.forEach(function (x) { l = l.concat(unificado ? folhasDaTarefa(x) : [x]); });
        marcar(l.filter(passaTipo), v);
      }
    } else if (t.hasAttribute('data-tipobox')) {
      marcar(folhasDoTipo(t.getAttribute('data-tipobox')), v);
    }
  });

  root.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    if (b.hasAttribute('data-andamento')) {
      if (carga !== 'pronto' || salvando > 0) return;
      var ref = b.getAttribute('data-andamento');
      var alvo = ref.indexOf('tarefa:') === 0 ? acharTarefa(ref.slice(7)) : acharItem(ref.slice(5));
      if (alvo) marcarAndamento(alvo, !alvo.em_andamento);
      return;
    }
    if (b.hasAttribute('data-abrir')) {
      var chave = b.getAttribute('data-abrir');
      var id = chave.slice(2);
      var lista;
      if (chave.charAt(0) === 'f') {
        var f = acharFase(id);
        if (!f) return;
        lista = [];
        f.tarefas.forEach(function (t) { lista = lista.concat(folhasDaTarefa(t)); });
        lista = lista.filter(passaTipo);
      } else if (chave.charAt(0) === 't') {
        lista = folhasDoTipo(id);
      } else {
        var g = acharGrupo(id);
        if (!g) return;
        lista = g.folhas.filter(noEscopo);
      }
      ui.abertos[chave] = !aberto(chave, lista);
    } else if (b.hasAttribute('data-filtros')) {
      ui.filtrosAbertos = !ui.filtrosAbertos;
    } else if (b.hasAttribute('data-filtro')) {
      ui.filtro = b.getAttribute('data-filtro');
    } else if (b.hasAttribute('data-fase')) {
      ui.fase = b.getAttribute('data-fase');
    } else if (b.hasAttribute('data-tipo')) {
      ui.tipo = b.getAttribute('data-tipo');
    } else if (b.hasAttribute('data-aba')) {
      ui.aba = b.getAttribute('data-aba');
    } else if (b.hasAttribute('data-acao')) {
      var abrir = b.getAttribute('data-acao') === 'abrir';
      if (ui.aba === 'cronograma') fases.forEach(function (fx) { ui.abertos['f:' + fx.id] = abrir; });
      else if (ui.aba === 'tipos') Object.keys(TIPOS).forEach(function (k) { ui.abertos['t:' + k] = abrir; });
      else grupos.forEach(function (gx) { ui.abertos['g:' + gx.id] = abrir; });
    } else {
      return;
    }
    salvarUi();
    render();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sb && carga === 'pronto' && salvando === 0) carregar();
  });

  render();
  if (sb) { carregar(); ouvirMudancas(); }
})();
</script>
